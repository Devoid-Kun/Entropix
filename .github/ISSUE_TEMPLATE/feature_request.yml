name: Feature request
description: Suggest something new for Entropix
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or annoying right now
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like to see instead
    validations:
      required: true
